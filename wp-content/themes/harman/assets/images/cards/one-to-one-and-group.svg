<svg xmlns="http://www.w3.org/2000/svg" width="240" height="200" viewBox="0 0 240 200" role="img" aria-label="A teacher speaking with a small group of students">
<style>
.w path{fill:none;stroke:#D2533E;stroke-width:5;stroke-linecap:round;animation:wv 2.4s ease-in-out infinite}
.w path:nth-child(2){animation-delay:.25s}.w path:nth-child(3){animation-delay:.5s}
.one{animation:r1 6s ease-in-out infinite}.all{animation:ra 6s ease-in-out infinite}
.bob{animation:bob 2.4s ease-in-out infinite}.bob2{animation:bob 2.4s ease-in-out .4s infinite}.bob3{animation:bob 2.4s ease-in-out .8s infinite}
@keyframes wv{0%{opacity:0}35%{opacity:1}80%,100%{opacity:0}}
@keyframes r1{0%,5%{opacity:0}12%,34%{opacity:1}42%,100%{opacity:0}}
@keyframes ra{0%,44%{opacity:0}52%,88%{opacity:1}96%,100%{opacity:0}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.w path{opacity:1}.one{opacity:0}.all{opacity:1}}
</style>
<circle cx="120" cy="104" r="92" fill="#F6E9FB"/>
<g class="bob"><path d="M16 192a34 34 0 0 1 68 0z" fill="#39074E"/><circle cx="50" cy="132" r="19" fill="#EBC258"/><path d="M31 130a19 19 0 0 1 38 0c-8-9-30-9-38 0z" fill="#39074E"/></g>
<g class="w"><path d="M92 112q12 16 0 32"/><path d="M104 102q18 26 0 52"/><path d="M116 92q24 36 0 72"/></g>
<g class="bob2"><path d="M130 192a22 22 0 0 1 44 0z" fill="#D2533E"/><circle cx="152" cy="150" r="13" fill="#EBC258"/></g>
<g class="bob3"><path d="M164 192a22 22 0 0 1 44 0z" fill="#39074E"/><circle cx="186" cy="142" r="13" fill="#EBC258"/></g>
<g class="bob2"><path d="M198 192a22 22 0 0 1 44 0z" fill="#D2533E"/><circle cx="220" cy="150" r="13" fill="#EBC258"/></g>
<circle class="one" cx="152" cy="150" r="21" fill="none" stroke="#39074E" stroke-width="4"/>
<g class="all" fill="none" stroke="#39074E" stroke-width="4"><circle cx="152" cy="150" r="21"/><circle cx="186" cy="142" r="21"/><circle cx="220" cy="150" r="21"/></g>
<text x="152" y="108" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="15" fill="#39074E" class="one">1:1</text>
<text x="186" y="100" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="15" fill="#39074E" class="all">Group</text>
</svg>
