<svg xmlns="http://www.w3.org/2000/svg" width="240" height="200" viewBox="0 0 240 200" role="img" aria-label="Two people practising French in conversation">
<style>
.b{transform-box:fill-box;transform-origin:50% 100%}
.a{animation:pa 6s ease-in-out infinite both}
.r{animation:pb 6s ease-in-out infinite both}
.t{animation:pt 6s ease-in-out infinite both}
.t circle{animation:dot .9s ease-in-out infinite}
.t circle:nth-child(2){animation-delay:.15s}.t circle:nth-child(3){animation-delay:.3s}
@keyframes pa{0%,3%{opacity:0;transform:scale(.5)}10%,82%{opacity:1;transform:scale(1)}94%,100%{opacity:0;transform:scale(.9)}}
@keyframes pt{0%,24%{opacity:0}28%,40%{opacity:1}44%,100%{opacity:0}}
@keyframes pb{0%,42%{opacity:0;transform:scale(.5)}50%,82%{opacity:1;transform:scale(1)}94%,100%{opacity:0;transform:scale(.9)}}
@keyframes dot{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.t{display:none}}
</style>
<circle cx="120" cy="104" r="92" fill="#F6E9FB"/>
<path d="M20 192a30 30 0 0 1 60 0z" fill="#39074E"/><circle cx="50" cy="152" r="16" fill="#EBC258"/><path d="M34 150a16 16 0 0 1 32 0c-6-8-24-8-32 0z" fill="#39074E"/>
<path d="M160 192a30 30 0 0 1 60 0z" fill="#D2533E"/><circle cx="190" cy="152" r="16" fill="#EBC258"/><path d="M174 150a16 16 0 0 1 32 0c-8 5-24 5-32 0z" fill="#D2533E"/>
<g class="b a"><rect x="14" y="30" width="108" height="48" rx="20" fill="#39074E"/><path d="M36 76h20l-12 22z" fill="#39074E"/><text x="68" y="61" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="19" fill="#fff">Bonjour!</text></g>
<g class="t" fill="#39074E"><rect x="142" y="86" width="56" height="30" rx="15" fill="#EBC258"/><circle cx="159" cy="101" r="3.5"/><circle cx="170" cy="101" r="3.5"/><circle cx="181" cy="101" r="3.5"/></g>
<g class="b r"><rect x="118" y="62" width="108" height="48" rx="20" fill="#EBC258"/><path d="M186 108h20l-6 22z" fill="#EBC258"/><text x="172" y="93" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="19" fill="#39074E">Salut !</text></g>
</svg>
