<svg xmlns="http://www.w3.org/2000/svg" width="240" height="200" viewBox="0 0 240 200" role="img" aria-label="A trophy surrounded by speaking, writing, reading and listening skills">
<style>
.tp{transform-box:fill-box;transform-origin:50% 100%;animation:tp 6s ease-in-out infinite both}
.ch{transform-box:fill-box;transform-origin:center;animation:ch 6s ease-in-out infinite both}
.c2{animation-delay:.4s}.c3{animation-delay:.8s}.c4{animation-delay:1.2s}
.sp{transform-box:fill-box;transform-origin:center;animation:sp 2.4s ease-in-out infinite}
.s2{animation-delay:.8s}.s3{animation-delay:1.6s}
.st{transform-box:fill-box;transform-origin:center;animation:st 6s ease-in-out infinite both}
@keyframes tp{0%,4%{opacity:0;transform:translateY(22px) scale(.8)}18%,88%{opacity:1;transform:none}96%,100%{opacity:0;transform:translateY(8px)}}
@keyframes ch{0%,16%{opacity:0;transform:scale(.3)}26%{opacity:1;transform:scale(1.15)}32%,88%{opacity:1;transform:scale(1)}96%,100%{opacity:0;transform:scale(.8)}}
@keyframes sp{0%,100%{opacity:0;transform:scale(.3) rotate(0)}50%{opacity:1;transform:scale(1) rotate(45deg)}}
@keyframes st{0%,40%{transform:scale(1)}50%{transform:scale(1.3) rotate(18deg)}60%,100%{transform:scale(1) rotate(0)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.sp{display:none}}
</style>
<circle cx="120" cy="104" r="92" fill="#F6E9FB"/>
<g class="tp"><rect x="94" y="152" width="52" height="13" rx="4" fill="#39074E"/><rect x="111" y="130" width="18" height="24" fill="#EBC258"/>
<path d="M90 66h-12c0 18 6 30 18 33M150 66h12c0 18-6 30-18 33" fill="none" stroke="#EBC258" stroke-width="7" stroke-linecap="round"/>
<path d="M88 58h64v26c0 22-14 36-32 36S88 106 88 84z" fill="#EBC258"/><path d="M96 62v22c0 14 6 24 14 29" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="5" stroke-linecap="round"/>
<path class="st" d="M120 72l5 11 12 1-9 8 3 12-11-7-11 7 3-12-9-8 12-1z" fill="#39074E"/></g>
<g class="ch"><circle cx="38" cy="48" r="23" fill="#39074E"/><rect x="25" y="39" width="26" height="17" rx="8" fill="#fff"/><path d="M31 54l-3 8 9-7z" fill="#fff"/></g>
<g class="ch c2"><circle cx="202" cy="48" r="23" fill="#D2533E"/><path d="M191 62l4-11 15-15 7 7-15 15z" fill="#fff"/><path d="M191 62l4-11 7 7z" fill="#39074E"/></g>
<g class="ch c3"><circle cx="38" cy="152" r="23" fill="#EBC258"/><path d="M38 142q-9-4-18-1v19q9-3 18 1zM38 142q9-4 18-1v19q-9-3-18 1z" fill="#fff" stroke="#39074E" stroke-width="3" stroke-linejoin="round"/></g>
<g class="ch c4"><circle cx="202" cy="152" r="23" fill="#39074E"/><path d="M190 154a12 12 0 0 1 24 0" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/><rect x="186" y="152" width="8" height="13" rx="3.5" fill="#fff"/><rect x="210" y="152" width="8" height="13" rx="3.5" fill="#fff"/></g>
<path class="sp" d="M160 30l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" fill="#EBC258"/><path class="sp s2" d="M78 28l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" fill="#D2533E"/><path class="sp s3" d="M176 118l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" fill="#39074E"/>
</svg>
